<!-- 声明这是一个HTML5网页（必须写在第一行） -->
<!DOCTYPE html>

<!-- 网页根标签，语言是中文 -->
<html lang="zh-CN">

<!-- 头部：给浏览器看的设置，用户看不见 -->
<head>
    <meta charset="UTF-8"> <!-- 文字编码：UTF-8，防止乱码 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 让页面适配手机屏幕，不缩放 -->
    <title>发票信息</title> <!-- 浏览器顶部标签显示的文字 -->
    <style> /* 这里开始写样式（控制页面长什么样） */

        /* * 代表所有元素，清除默认边距，让页面整齐 */
        * {
            margin: 0; /* 去掉所有元素默认外边距 */
            padding: 0; /* 去掉所有元素默认内边距 */
            box-sizing: border-box; /* 让宽高计算更标准 */
        }

        /* body 是整个页面的身体 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; /* 手机最清晰的字体 */
            background: #fff; /* 页面背景：白色 */
            padding: 20px; /* 页面四周留20px空隙 */
            color: #333; /* 文字默认颜色：深灰色 */
            padding-bottom: 80px; /* 底部留空，防止被固定文字挡住 */
        }

        /* 标题样式：发票信息 */
        .title {
            font-size: 22px; /* 字体大小：22像素（小字体） */
            font-weight: bold; /* 字体加粗 */
            text-align: center; /* 文字水平居中 */
            margin-bottom: 30px; /* 标题下面留30px空隙 */
        }

        /* 顶部提示文字样式 */
        .top-tips {
            font-size: 16px; /* 字体大小16px */
            line-height: 1.8; /* 行高，让文字不拥挤 */
            text-align: center; /* 居中 */
            color: #333; /* 深灰色 */
            margin-bottom: 50px; /* 下面留50px空隙 */
            padding: 0 10px; /* 左右留10px空隙 */
        }

        /* 内容区域样式 */
        .content {
            margin-bottom: 30px; /* 底部留30px空隙 */
        }

        /* 每一行信息（标签+内容） */
        .info-item {
            display: flex; /* 让标签和内容并排显示 */
            font-size: 14px; /* 字体18px */
            margin-bottom: 15px; /* 每行之间留15px空隙 */
        }

        /* 左侧灰色标签：发票号码、合计金额... */
        .info-label {
            width: 120px; /* 固定宽度120px */
            color: #999; /* 浅灰色 */
        }

        /* 👇 核心：固定在屏幕最底部的文字 */
        .bottom-tips {
            position: fixed; /* 固定在屏幕上，不滚动 */
            bottom: 20px; /* 距离屏幕底部20px */
            left: 0; /* 左边贴紧屏幕 */
            right: 0; /* 右边贴紧屏幕 */
            font-size: 14px; /* 字体大小 */
            color: #999; /* 浅灰色 */
            text-align: center; /* 居中 */
            background: #ffffff; /* 背景白色，盖住内容 */
            padding: 10px 0; /* 上下留10px空隙 */
        }

    </style> <!-- 样式结束 -->
</head> <!-- 头部结束 -->

<!-- 页面正文：用户能看到的内容 -->
<body>

    <!-- 标题：小、细、居中 -->
    <div class="title">发票信息</div>

    <!-- 顶部提示文字 -->
    <div class="top-tips">
        以下信息仅为发票二维码所含信息，并不代表查验发票真伪的结果。
    </div>

    <!-- 发票信息内容 -->
    <div class="content">
        <div class="info-item"><div class="info-label">发票号码</div><div>2441200</div></div>
        <div class="info-item"><div class="info-label">合计金额</div><div>¥174000.00(含税)</div></div>
        <div class="info-item"><div class="info-label">开票日期</div><div>2024.09.23</div></div>
    </div>

    <!-- 👇 核心：永远固定在手机屏幕最底部的文字 -->
    <div class="bottom-tips">以下信息仅为发票二维码所含信息，不代表查验结果。</div>

</body> <!-- 正文结束 -->
</html> <!-- 网页结束 -->
