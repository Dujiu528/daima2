<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 标题设为空，彻底隐藏顶部文字 -->
    <title></title>
    <!-- 禁止缩放、适配手机全屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 微信/浏览器沉浸式全屏，隐藏网址栏 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="portrait">
    <meta name="full-screen" content="yes">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{width:100%;height:100vh;overflow:hidden;}
    </style>
</head>
<body>

    <!-- 标题：小、细、居中 -->
    <div class="title">发票信息</div>

    <!-- 顶部提示文字 -->
    <div class="top-tips">
        以下信息仅为发票二维码所含信息，并不代表查验发票真伪的结果。
    </div>

    <!-- 发票信息内容 -->
    <div class="content">
        <div class="info-item"><div class="info-label">发票号码</div><div>2441200</div></div>
        <div class="info-item"><div class="info-label">合计金额</div><div>¥174000.00(含税)</div></div>
        <div class="info-item"><div class="info-label">开票日期</div><div>2024.09.23</div></div>
    </div>

    <!-- 👇 核心：永远固定在手机屏幕最底部的文字 -->
    <div class="bottom-tips">以下信息仅为发票二维码所含信息，不代表查验结果。</div>

</body> <!-- 正文结束 -->
</html> <!-- 网页结束 -->
